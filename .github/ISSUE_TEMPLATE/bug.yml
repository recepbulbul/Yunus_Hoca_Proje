name: Hata bildirimi
description: Beklenmeyen davranış
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Ne oldu?
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Yeniden üretme adımları (deney seed'i dahil)
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: Beklenen davranış
  - type: textarea
    id: logs
    attributes:
      label: Log / Langfuse trace ID
      render: shell
