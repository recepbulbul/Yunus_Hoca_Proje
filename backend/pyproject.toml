[project]
name = "mindex"
version = "0.1.0"
description = "Mindex: kalıcı hafıza ve güven tabanlı forumla birlikte öğrenen kripto ticaret ajanları arenası"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Recep Bülbül" },
    { name = "Meryem Arpacı" },
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mindex"]

# --- Ruff ---------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "N",        # naming
    "S",        # bandit (security)
    "PT",       # pytest style
    "RUF",
]
allowed-confusables = ["ı"]  # Turkish dotless i is intentional in Turkish text

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works

# --- Pyright ------------------------------------------------------------
[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

# --- Pytest -------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=mindex --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
branch = true
source = ["mindex"]
